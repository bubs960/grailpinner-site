<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrailPulse — Coming Soon</title>
<meta name="description" content="GrailPulse is coming soon. Part of the GrailPulse family — FigurePinner is live now.">
<meta name="robots" content="index,follow">
<style>
  :root { color-scheme: light dark; --bg:#0b0d12; --fg:#f3f4f6; --muted:#9aa3b2; --accent:#d4a017; --link:#7cc4ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#fafafa; --fg:#111318; --muted:#5b6472; --accent:#9a6f00; --link:#0b63c4; } }
  html,body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; box-sizing:border-box; }
  main { max-width:560px; text-align:center; }
  .brand { font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:0 0 20px; }
  h1 { font-size:clamp(28px,6vw,40px); line-height:1.15; margin:0 0 16px; font-weight:700; }
  p { color:var(--muted); margin:0 0 28px; font-size:18px; }
  a.cta { display:inline-block; padding:14px 26px; border-radius:10px; background:var(--fg); color:var(--bg);
          font-weight:600; text-decoration:none; }
  a.cta:hover { opacity:.9; }
</style>
</head>
<body>
<main>
  <p class="brand">GrailPulse</p>
  <h1>Coming soon</h1>
  <p>Part of the GrailPulse family — FigurePinner is live now.</p>
  <a class="cta" href="https://figurepinner.com">Visit FigurePinner</a>
</main>
</body>
</html>
